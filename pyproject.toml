[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotframework-agentguard"
version = "0.2.0"
description = "Robot Framework library for testing Agent Skills, Hooks, SubAgents, and MCP Servers — provider-agnostic, BFCL-grade tool-call matching, #42796 behavioral metrics, statistical non-determinism handling."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentGuard contributors" }]
keywords = ["robotframework", "mcp", "agent-skills", "llm-eval", "bfcl", "a2a", "agentguard"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Robot Framework :: Library",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "robotframework>=7.4.2",
  "robotframework-pythonlibcore>=4.5.0",
  "mcp>=1.27.0",
  "fastmcp>=3.2.4",
  "litellm>=1.83.0",
  "inspect-ai>=0.3.217",
  "inspect-evals>=0.10.1",
  "scipy>=1.17.1",
  "numpy>=1.26",
  "httpx>=0.28.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "jsonschema>=4.23",
  "opentelemetry-api>=1.41.1",
  "opentelemetry-sdk>=1.41.1",
  "rich>=13.9",
  "anthropic>=0.98.1",
  "a2a-sdk>=1.0.2",
  "docker>=7.1.0",
  "jsonlines>=4.0",
  "gitpython>=3.1",
  # ADR-022: Shared Kernel for assertion operators (Browser Library / SeleniumLibrary idiom).
  "robotframework-assertion-engine>=4.0,<5.0",
]

[project.optional-dependencies]
bridges = [
  "langgraph>=0.2",
  "crewai>=0.95",
  "openai-agents>=0.15.1",
]
benchmarks = [
  "datasets>=3.0",
  "huggingface-hub>=1.13.0",
]
integrations = [
  # Live `rf-mcp` MCP server — exercised by tests/integration/test_rf_mcp_integration.py.
  # Pinned loose so we follow upstream releases.
  "rf-mcp>=0.30",
]

[project.entry-points."robot.listener"]
otel = "AgentGuard.telemetry.otel_listener:OTelListener"

[project.scripts]
agentguard = "AgentGuard.cli:main"

[project.urls]
Repository = "https://github.com/manykarim/robotframework-agentguard"
Documentation = "https://github.com/manykarim/robotframework-agentguard#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/AgentGuard"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-mock>=3.14",
  "pytest-cov>=6.0",
  "pytest-benchmark>=5.0",
  "pytest-mcp>=0.1.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "types-jsonschema",
]
experiments = [
  "fastmcp>=3.2.4",
  "httpx>=0.28.1",
  "inspect-ai>=0.3.217",
  "inspect-evals>=0.10.1",
  "litellm>=1.83.0",
  "mcp>=1.27.0",
  "opentelemetry-api>=1.41.1",
  "opentelemetry-sdk>=1.41.1",
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "pytest-mcp>=0.1.0",
  "robotframework>=7.4.2",
  "robotframework-assertion-engine>=4.0.0",
  "robotframework-pythonlibcore>=4.5.0",
  "scipy>=1.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
addopts = "-q --strict-markers -p no:mcp_eval"
markers = [
  "live: requires OPENROUTER_API_KEY (network)",
  "slow: long-running",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
# N999: package is intentionally PascalCase to match Robot Framework `Library AgentGuard` convention.
# S110: empty try/except is the documented pattern for FastMCP capability probing (see _helpers.py).
# N818: AgentGuard's exception hierarchy uses status-tagged names (SessionParseFailed,
#       SandboxUnavailable, MetricThresholdViolated) where the status IS the meaningful suffix.
# B017: blind `except Exception` is intentional in tests that assert *any* validation failure.
# E731: lambda-assignment is acceptable for tiny test helpers.
# UP007: legacy `Optional[X]` / `Union[X, Y]` annotations remain valid in public surfaces.
ignore = ["S101", "N999", "S110", "N818", "B017", "E731", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N"]
"benchmarks/**/*.py" = ["S", "N"]
# Experiments are throwaway dependency-validation scripts — looser rules.
"tests/experiments/*.py" = ["UP031", "F841", "B007", "E402", "F401"]
# Integration tests for upstream packages do sys.path manipulation BEFORE imports.
"tests/integration/test_rf_mcp_*.py" = ["E402"]
"tests/integration/test_agentskills_live.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Re-export of `ToolCall` for convenience in metric tests; intentional.
"tests/unit/coding_agent/metrics/test_pack.py" = ["F401"]
# Test helper that builds a rubric for negative-path coverage; analyzer can't see use.
"tests/unit/judge/test_judge_keywords.py" = ["F841"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
omit = [
  # HTTP transport requires a live A2A server; covered by `live`-tagged integration test only.
  "src/AgentGuard/subagents/a2a_http.py",
  # Bridge method bodies only execute when the optional `[bridges]` deps are installed.
  # Their `is_available()` + protocol shape is tested; bodies covered in the bridges-extra CI matrix.
  "src/AgentGuard/subagents/bridges/langgraph_bridge.py",
  "src/AgentGuard/subagents/bridges/crewai_bridge.py",
  "src/AgentGuard/subagents/bridges/autogen_bridge.py",
  "src/AgentGuard/subagents/bridges/openai_agents_bridge.py",
  # AIDefence MCP path exercised live via claude-flow MCP server in Phase 4 integration tests.
  "src/AgentGuard/security/aidefence.py",
  # Stub file kept for backwards-compat; real matcher is bfcl_matcher.py.
  "src/AgentGuard/tool_calls/matcher.py",
  # Sandbox backends with NotImplementedError stubs (Phase 3).
  "src/AgentGuard/security/sandbox_backends/k8s_backend.py",
  "src/AgentGuard/security/sandbox_backends/proxmox_backend.py",
]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
