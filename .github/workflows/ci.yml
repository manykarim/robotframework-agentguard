name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual dispatch from the Actions tab (or `gh workflow run ci.yml --ref <branch>`)
  # so we can dry-run the live suite on a feature branch before opening a PR.
  workflow_dispatch:

# Minimal default permissions; jobs that need more elevate explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.20"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint-type:
    name: lint + type
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dev deps
        run: uv sync --group dev --frozen
      - name: ruff check
        run: uv run ruff check src tests benchmarks
      - name: ruff format --check
        run: uv run ruff format --check src tests benchmarks
      - name: mypy
        run: uv run mypy src tests

  test-unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --group dev --frozen
      - name: pytest unit
        run: |
          uv run pytest tests/unit -q \
            --cov=src/AgentGuard \
            --cov-report=term-missing \
            --cov-fail-under=80

  test-integration-offline:
    name: integration (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Install the `[integrations]` extra so `rf-mcp` is importable for the
      # rf-mcp integration suite (it's an opt-in extra; without it those tests
      # would silently skip).
      - run: uv sync --group dev --extra integrations --frozen
      - name: pytest integration -m "not live"
        run: uv run pytest tests/integration -q -m "not live"

  test-acceptance:
    name: acceptance (robot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # `[integrations]` extra needed for examples/10_rf_mcp_integration.robot.
      - run: uv sync --group dev --extra integrations --frozen
      - name: robot tests/acceptance
        run: |
          if [ -d tests/acceptance ]; then
            PYTHONPATH=. uv run robot --exclude live --outputdir _robot_out tests/acceptance/
          fi
      - name: robot examples (Phase-1+2+3 + integrations)
        run: |
          PYTHONPATH=. uv run robot --exclude live --outputdir _robot_out examples/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-acceptance-output
          path: _robot_out/
          if-no-files-found: ignore

  test-live:
    name: live (real OpenRouter LLM)
    # Run on push to main AND on PRs from same-repo branches (forks have no
    # secret access by GitHub policy).
    if: |
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-unit
    # Don't fail the whole CI on a transient OpenRouter glitch — surface the
    # failure in the job log but let the rest of the matrix complete.
    continue-on-error: true
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Install integrations extra so rf-mcp lives in the venv for the live
      # rf-mcp tests, AND the dev group for pytest plumbing.
      - run: uv sync --group dev --extra integrations --extra benchmarks --frozen

      # Discovered-mode tests under tests/integration/test_agentskills_*.py walk
      # an upstream clone of robotframework-agentskills if present. Bundle it so
      # those tests get exercised in CI (pin at a known-good ref to avoid drift).
      - name: Clone robotframework-agentskills for discovered-mode tests
        run: |
          mkdir -p $HOME/workspace
          git clone --depth 1 https://github.com/manykarim/robotframework-agentskills.git \
            $HOME/workspace/robotframework-agentskills

      - name: Verify OPENROUTER_API_KEY present (do not print it)
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "::error::OPENROUTER_API_KEY secret is missing"
            exit 1
          fi
          echo "OPENROUTER_API_KEY: set (length=${#OPENROUTER_API_KEY})"

      # Phase 1+2+3 live integration suite (judge calibration, subagents, coding-agent).
      - name: pytest -m live (full)
        run: uv run pytest tests/integration -q -m live --tb=short

      # Targeted live runs for the two upstream integrations.
      - name: pytest live — rf-mcp end-to-end
        run: uv run pytest tests/integration/test_rf_mcp_live.py -q -m live --tb=short

      - name: pytest live — robotframework-agentskills end-to-end
        run: uv run pytest tests/integration/test_agentskills_live.py -q -m live --tb=short

      # Always-on integration suite re-run with key + integrations extra so
      # the offline tests for rf-mcp + agentskills also exercise the live env
      # (they themselves don't call the LLM but it's a useful smoke pass).
      - name: pytest integration — rf-mcp + agentskills (offline path, with extras)
        run: |
          uv run pytest \
            tests/integration/test_rf_mcp_integration.py \
            tests/integration/test_agentskills_integration.py \
            -q --tb=short

      # Robot live suite (examples tagged `live`).
      - name: robot --include live (examples)
        run: |
          PYTHONPATH=. uv run robot --include live --outputdir _robot_live examples/ || true
          if [ -d tests/acceptance ]; then
            PYTHONPATH=. uv run robot --include live --outputdir _robot_live tests/acceptance/ || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-test-output
          path: _robot_live/
          if-no-files-found: ignore

  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --group dev --frozen
      - name: pytest benchmarks/
        run: |
          uv run pytest benchmarks/ \
            --benchmark-only \
            --benchmark-json=benchmarks/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results.json
          if-no-files-found: warn

  doctor:
    name: agentguard doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run agentguard doctor
